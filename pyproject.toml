[project]
name = "docbot"
version = "0.1.0"
description = "AI-powered documentation chatbot for iOS teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-ollama>=0.1",
    "langchain-openai>=0.1",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "pinecone>=3.0",
    "langchain-pinecone>=0.1",
    "slack-bolt>=1.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "scripts"]
